<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Type is a one-page 3D typewriter simulator with animated keys, striking typebars, sound effects, and PDF export."
    />
    <title>Type - 3D Typewriter Simulator</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20261014-6" />
  </head>
  <body>
    <main class="type-app" aria-labelledby="app-title">
      <header class="top-bar" role="toolbar" aria-label="Type controls">
        <a class="brand" href="./" id="app-title" aria-label="Type home">Type<span class="brand-dot">.</span></a>
        <span class="brand-caption">THE WRITING ROOM</span>

        <div class="toolbar-cluster">
          <button class="control-button icon-button sound-toggle" type="button" data-sound-toggle aria-pressed="true" aria-label="Sound on" title="Sound on">
            <i data-lucide="volume-2" class="ui-icon" aria-hidden="true"></i>
            <span class="sr-only" data-sound-label>Sound on</span>
          </button>

          <button class="control-button icon-button reset-button" type="button" data-reset aria-label="New sheet" title="New sheet">
            <i data-lucide="file-plus-2" class="ui-icon" aria-hidden="true"></i>
          </button>

          <button class="control-button icon-button focus-toggle" type="button" data-focus-mode aria-pressed="false" aria-label="Focus on paper" title="Focus on paper">
            <i data-lucide="focus" class="ui-icon" aria-hidden="true"></i>
            <span class="sr-only" data-focus-label>Focus</span>
          </button>
        </div>

        <details class="palette-menu" data-palette-menu open>
          <summary class="control-button icon-button" role="button" aria-label="Ribbon and paper colors" title="Ribbon and paper colors"><i data-lucide="palette" class="ui-icon" aria-hidden="true"></i></summary>
          <div class="palette-options">
        <div class="toolbar-cluster swatch-group" aria-label="Ink color">
          <span class="tool-label">Ribbon</span>
          <button class="swatch ink-swatch is-selected" type="button" data-ink="#201b17" style="--swatch: #201b17" aria-label="Black ink" aria-pressed="true"></button>
          <button class="swatch ink-swatch" type="button" data-ink="#1d2b53" style="--swatch: #1d2b53" aria-label="Blue ink" aria-pressed="false"></button>
          <button class="swatch ink-swatch" type="button" data-ink="#641b1f" style="--swatch: #641b1f" aria-label="Burgundy ink" aria-pressed="false"></button>
        </div>

        <div class="toolbar-cluster swatch-group" aria-label="Paper tone">
          <span class="tool-label">Paper</span>
          <button class="swatch paper-swatch is-selected" type="button" data-paper="ivory" style="--swatch: #efe2ca" aria-label="Ivory paper" aria-pressed="true"></button>
          <button class="swatch paper-swatch" type="button" data-paper="linen" style="--swatch: #dbc39c" aria-label="Linen paper" aria-pressed="false"></button>
          <button class="swatch paper-swatch" type="button" data-paper="mist" style="--swatch: #d8d4c9" aria-label="Mist paper" aria-pressed="false"></button>
        </div>
          </div>
        </details>

        <button class="control-button export-button" type="button" data-export-pdf aria-label="Export PDF" title="Export PDF">
          <i data-lucide="download" class="ui-icon" aria-hidden="true"></i>
          <span>Export PDF</span>
        </button>
      </header>

      <aside class="command-rail" data-command-rail aria-label="Typewriter shortcuts" aria-hidden="false">
        <div class="rail-header">
          <strong>Machine controls</strong>
          <button
            class="rail-mode"
            type="button"
            data-realistic-backspace
            aria-pressed="true"
            role="switch"
            aria-checked="true"
            title="When on, Backspace moves the carriage without erasing ink."
          >
            <span class="switch-track" aria-hidden="true"></span>
            <span data-backspace-label>Realistic Backspace: On</span>
          </button>
          <button class="rail-collapse" type="button" data-sidebar-toggle aria-expanded="true" title="Hide the shortcut panel.">
            <i data-lucide="chevron-down" class="ui-icon" aria-hidden="true"></i>
            <span class="sr-only" data-sidebar-label>Hide</span>
          </button>
        </div>
        <div class="rail-actions" aria-label="Typewriter controls">
          <button class="rail-command" type="button" data-ribbon-cycle data-tooltip="Cycle the ribbon between black and burgundy ink.">
            <span>Change ribbon</span><kbd>F1</kbd>
          </button>
          <button class="rail-command" type="button" data-margin-release data-tooltip="Temporarily type beyond the left or right margin.">
            <span>Margin release</span><kbd>Alt</kbd>
          </button>
          <button class="rail-command" type="button" data-correction-ribbon data-tooltip="Lift the correction ribbon and leave a rough white patch.">
            <span>Correction ribbon</span><kbd>Del</kbd>
          </button>
          <button class="rail-command" type="button" data-tab-stop data-tooltip="Move the carriage to the next tab stop.">
            <span>Tab stop</span><kbd>Tab</kbd>
          </button>
          <button class="rail-command" type="button" data-left-margin data-tooltip="Set the left margin at the current carriage position.">
            <span>Set left margin</span><kbd>F3</kbd>
          </button>
          <button class="rail-command" type="button" data-right-margin data-tooltip="Set the right margin at the current carriage position.">
            <span>Set right margin</span><kbd>F4</kbd>
          </button>
          <button class="rail-command" type="button" data-paper-up data-tooltip="Roll the paper upward through the platen.">
            <span>Paper up</span><kbd>PgUp</kbd>
          </button>
          <button class="rail-command" type="button" data-paper-down data-tooltip="Roll the paper downward through the platen.">
            <span>Paper down</span><kbd>PgDn</kbd>
          </button>
          <button class="rail-command" type="button" data-carriage-return data-tooltip="Return the carriage and advance to the next line. Cmd/Ctrl + Enter also works.">
            <span>Carriage return</span><kbd>Enter</kbd>
          </button>
          <button class="rail-command" type="button" data-clear-page data-tooltip="Start over with a fresh sheet.">
            <span>New sheet</span><kbd>F10</kbd>
          </button>
        </div>
      </aside>
      <button class="rail-peek" type="button" data-sidebar-toggle aria-expanded="false" aria-hidden="true" hidden>
        <i data-lucide="keyboard" class="ui-icon" aria-hidden="true"></i>
        <span data-sidebar-label>Shortcuts</span>
      </button>
      <footer class="workspace-footer">
        <span class="page-caption"><span class="save-dot" aria-hidden="true"></span> Your page <span class="save-label" data-save-label>Saved locally</span></span>
        <span class="machine-caption">TYPE / No. 01</span>
      </footer>

      <section class="scene-stage" aria-label="3D typewriter simulator" data-stage>
        <canvas class="typewriter-canvas" data-scene aria-hidden="true"></canvas>
        <textarea
          id="writer-input"
          class="writer-input"
          data-input
          spellcheck="false"
          autocomplete="off"
          autocapitalize="sentences"
          aria-label="Type your page"
        ></textarea>
        <div class="intro-hint" data-intro-hint role="status" aria-hidden="false">
          <i data-lucide="corner-down-left" class="ui-icon" aria-hidden="true"></i>
          <span>Click anywhere and start typing.</span>
        </div>
        <div class="mobile-assist" data-mobile-assist>
          <span>Best experienced with a physical keyboard.</span>
          <button type="button" data-mobile-keyboard-toggle aria-expanded="false">On-screen keys</button>
        </div>
        <div class="mobile-keyboard" data-mobile-keyboard aria-label="On-screen typewriter keyboard">
          <div class="mobile-key-row">
            <button type="button" data-mobile-key="q">Q</button>
            <button type="button" data-mobile-key="w">W</button>
            <button type="button" data-mobile-key="e">E</button>
            <button type="button" data-mobile-key="r">R</button>
            <button type="button" data-mobile-key="t">T</button>
            <button type="button" data-mobile-key="y">Y</button>
            <button type="button" data-mobile-key="u">U</button>
            <button type="button" data-mobile-key="i">I</button>
            <button type="button" data-mobile-key="o">O</button>
            <button type="button" data-mobile-key="p">P</button>
          </div>
          <div class="mobile-key-row">
            <button type="button" data-mobile-key="a">A</button>
            <button type="button" data-mobile-key="s">S</button>
            <button type="button" data-mobile-key="d">D</button>
            <button type="button" data-mobile-key="f">F</button>
            <button type="button" data-mobile-key="g">G</button>
            <button type="button" data-mobile-key="h">H</button>
            <button type="button" data-mobile-key="j">J</button>
            <button type="button" data-mobile-key="k">K</button>
            <button type="button" data-mobile-key="l">L</button>
          </div>
          <div class="mobile-key-row">
            <button type="button" data-mobile-key="Backspace">Back</button>
            <button type="button" data-mobile-key="z">Z</button>
            <button type="button" data-mobile-key="x">X</button>
            <button type="button" data-mobile-key="c">C</button>
            <button type="button" data-mobile-key="v">V</button>
            <button type="button" data-mobile-key="b">B</button>
            <button type="button" data-mobile-key="n">N</button>
            <button type="button" data-mobile-key="m">M</button>
            <button type="button" data-mobile-key="Enter">Return</button>
          </div>
          <div class="mobile-key-row">
            <button class="mobile-space" type="button" data-mobile-key=" ">Space</button>
          </div>
        </div>
        <div class="sr-only" data-output aria-live="polite"></div>
      </section>
    </main>

    <script src="assets/lucide.min.js"></script>
    <script type="module" src="script.js?v=20261014-6"></script>
  </body>
</html>
